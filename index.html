<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CET-6 词汇句子练习</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CET-6">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
--bg:#f5f0eb;--card:#fff;--text:#2c2416;--muted:#8b7355;--light:#b0a090;
--header-bg:#2c2416;--header-text:#e8d5b7;--border:#8b7355;--dash:#e0d5c5;
--know-bg:#8b7355;--know-text:#fff;--skip-bg:transparent;--skip-text:#8b7355;
--danger:#c44;--warn:#c0a060;--stat-bg:#ede6dd
}
body.dark{
--bg:#1a1815;--card:#2a2520;--text:#d8d0c8;--muted:#a09080;--light:#706050;
--header-bg:#0d0b08;--header-text:#c0b090;--border:#5a4a38;--dash:#3a3028;
--know-bg:#8b7355;--know-text:#fff;--skip-bg:transparent;--skip-text:#a09080;
--danger:#e55;--warn:#a08040;--stat-bg:#252018
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Microsoft YaHei',serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:var(--header-bg);color:var(--header-text);padding:10px 0;text-align:center}
.top h1{font-size:1.15em;font-weight:normal;letter-spacing:2px}
.top .info{font-size:.7em;opacity:.7;margin-top:2px}
.tools{display:flex;gap:5px;justify-content:center;padding:6px;flex-wrap:wrap}
.tb{padding:4px 12px;border:1px solid var(--border);border-radius:3px;font-size:.74em;
  cursor:pointer;background:transparent;color:var(--muted)}
.tb:hover{background:var(--border);color:#fff}
.tb.green{color:#5a8a5a;border-color:#5a8a5a}.tb.green:hover{background:#5a8a5a;color:#fff}
.tb.danger{color:var(--danger);border-color:var(--danger)}
.tb.danger:hover{background:var(--danger);color:#fff}
.levels{display:flex;gap:6px;justify-content:center;padding:6px}
.lv{padding:8px 18px;border:2px solid var(--border);background:transparent;color:var(--muted);
  font-size:.85em;cursor:pointer;border-radius:4px}
.lv:hover,.lv.on{background:var(--border);color:#fff}
.stats-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:6px 10px;font-size:.76em;color:var(--muted)}
.stats-bar span{background:var(--stat-bg);padding:3px 10px;border-radius:3px;white-space:nowrap}
.note{text-align:center;font-size:.74em;min-height:1.1em;margin:2px 0}
.note.ok{color:#5a8a5a}.note.err{color:var(--danger)}
.main{max-width:700px;margin:0 auto;padding:0 14px 70px}
.card{background:var(--card);border-radius:8px;padding:24px 26px;margin:12px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid var(--border);transition:opacity .3s}
.card.done{opacity:.25}.card.skip{opacity:.5;border-left-color:var(--warn)}
.card .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .rnk{font-size:.68em;color:var(--light)}
.card .cnt{font-size:.65em;color:var(--warn);font-style:italic}
.card .en{font-size:1.02em;line-height:1.6;margin-bottom:8px}
.card .sep{height:20px}
.card .zh{font-size:.85em;color:var(--muted);line-height:1.5;display:none;
  padding-top:8px;border-top:1px dashed var(--dash);margin-bottom:8px}
.card .tgl{font-size:.75em;color:var(--light);cursor:pointer;background:none;
  border:none;text-decoration:underline;padding:0;margin-bottom:10px;display:block}
.card .acts{margin-top:18px;display:flex;gap:14px}
.btn{padding:8px 20px;border:1px solid var(--border);border-radius:4px;font-size:.85em;cursor:pointer}
.btn-yes{background:var(--know-bg);color:var(--know-text)}.btn-yes:hover{opacity:.85}
.btn-no{background:var(--skip-bg);color:var(--skip-text)}.btn-no:hover{background:var(--stat-bg)}
.empty{text-align:center;padding:80px 0;color:var(--light);font-size:.95em}
.foot{text-align:center;padding:10px;color:var(--light);font-size:.68em;position:fixed;bottom:0;width:100%;background:var(--bg)}
input[type=file]{display:none}
.weak-list{margin:10px 0;font-size:.82em;max-height:200px;overflow-y:auto}
.weak-list table{width:100%;border-collapse:collapse}
.weak-list td{padding:4px 8px;border-bottom:1px solid var(--dash)}
.weak-list .wn{color:var(--warn);font-weight:bold}
</style>
</head>
<body>
<div class="top"><h1>CET-6 词汇句子练习</h1><div class="info" id="today-info"></div></div>
<div id="app"><div style="text-align:center;padding:60px;color:var(--muted)">加载中...</div></div>

<script src="data.js"></script>
<script src="index_data.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          setTimeout(function(){ window.location.reload(); }, 500);
        }
      });
    });
  }).catch(function(){});
}
</script>
<script>
(function(){
var pool = window.CET6_DATA || [];
var idx = window.CET6_INDEX || {};
if(!pool.length){document.getElementById('app').innerHTML='<div class="empty">数据加载失败</div>';return;}

var T = 10;
var s2w = idx.sentence_to_words || {};
var w2r = {};
pool.forEach(function(w){w2r[w.word.toLowerCase()]=w.freq_rank;});

var n = pool.length;
// Freq-rank based split: lower rank = more common
// 基础级: #1-2000, the most common words (25% of pool)
// 进阶级: #2001-4500, CET-6 core vocabulary (31% of pool)
// 高级: #4501-end, infrequent/advanced/academic words (44% of pool)
var LV = {
  L1:{label:'基础级（高频 2000 词）',a:0,b:2000},
  L2:{label:'进阶级（核心 2500 词）',a:2000,b:4500},
  L3:{label:'高级（进阶 3514 词）',a:4500,b:n}
};

var state = {}, cur = 'L1', noteTimer = null, darkMode = false;
var todayKey = new Date().toISOString().slice(0,10);
var todayLog = {};

// ---- localStorage ----
var LS_KEY = 'cet6_progress';

var STATE_VERSION = 2;

function saveLocal(){
  try{
    var cpt = {_version: STATE_VERSION};
    Object.keys(LV).forEach(function(k){
      cpt[k] = {active:state[k].active,stats:state[k].stats,poolSize:state[k].poolSize};
    });
    cpt._todayLog = todayLog; cpt._darkMode = darkMode;
    localStorage.setItem(LS_KEY, JSON.stringify(cpt));
  }catch(e){}
}

function migrateState(cpt, fromVer){
  if(fromVer < 2){
    Object.keys(LV).forEach(function(k){
      if(!cpt[k]) return;
      Object.keys(cpt[k].stats||{}).forEach(function(rk){
        if(cpt[k].stats[rk].skipCount === undefined) cpt[k].stats[rk].skipCount = 0;
      });
    });
    if(!cpt._todayLog) cpt._todayLog = {};
    if(cpt._darkMode === undefined) cpt._darkMode = false;
  }
  return cpt;
}

function loadLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    var cpt = JSON.parse(raw);
    var ver = cpt._version || 1;
    if(ver < STATE_VERSION) cpt = migrateState(cpt, ver);
    Object.keys(LV).forEach(function(k){
      if(cpt[k] && cpt[k].active !== undefined) state[k] = cpt[k];
    });
    if(cpt._todayLog) todayLog = cpt._todayLog;
    if(cpt._darkMode !== undefined) darkMode = cpt._darkMode;
    return true;
  }catch(e){return false;}
}

function todayStats(){
  var log = todayLog[todayKey] || {know:0, skip:0};
  return {know:log.know||0, skip:log.skip||0, total:(log.know||0)+(log.skip||0)};
}
function logToday(action){
  if(!todayLog[todayKey]) todayLog[todayKey] = {know:0, skip:0};
  todayLog[todayKey][action] = (todayLog[todayKey][action]||0) + 1;
}

// ---- State ----
function initState(){
  Object.keys(LV).forEach(function(k){
    state[k] = {active:[],stats:{},poolSize:pool.slice(LV[k].a,LV[k].b).length};
  });
}

function refill(k){
  var ls = state[k], lp = pool.slice(LV[k].a, LV[k].b);
  var need = T - ls.active.length;
  if(need <= 0) return;
  var aset = {}; ls.active.forEach(function(r){aset[r]=true;});
  var unseen=[], struggle=[], review=[];
  lp.forEach(function(w){
    if(aset[w.freq_rank]) return;
    var st = ls.stats[w.freq_rank]||{};
    if(!st.exposed) unseen.push(w);
    else if(st.mastered) review.push(w);
    else struggle.push(w);
  });
  struggle.sort(function(a,b){return (ls.stats[b.freq_rank]||{}).skipCount - (ls.stats[a.freq_rank]||{}).skipCount;});
  var picked = [];
  unseen.forEach(function(w){if(picked.length<need)picked.push(w);});
  struggle.forEach(function(w){if(picked.length<need)picked.push(w);});
  if(picked.length<need && review.length) picked.push(review[0]);
  lp.forEach(function(w){
    if(picked.length>=need) return;
    if(!aset[w.freq_rank] && picked.indexOf(w)<0) picked.push(w);
  });
  picked.forEach(function(w){
    ls.active.push(w.freq_rank);
    if(!ls.stats[w.freq_rank]) ls.stats[w.freq_rank]={};
    ls.stats[w.freq_rank].exposed = (ls.stats[w.freq_rank].exposed||0)+1;
  });
}

function master(rank){
  var ls = state[cur];
  if(!ls.stats[rank]) ls.stats[rank]={};
  ls.stats[rank].mastered = true;
  ls.active = ls.active.filter(function(r){return r!==rank;});
  var words = s2w[String(rank)]||[];
  words.forEach(function(wstr){
    var r = w2r[wstr.toLowerCase()];
    if(r && r!==rank){
      if(!ls.stats[r]) ls.stats[r]={};
      if(!ls.stats[r].mastered) ls.stats[r].mastered=true;
    }
  });
  refill(cur);
}

function stats(){
  var t=0,m=0,e=0;
  Object.keys(LV).forEach(function(k){
    var ls=state[k]; t+=ls.poolSize||0;
    Object.keys(ls.stats||{}).forEach(function(rk){
      if(ls.stats[rk].mastered) m++;
      if(ls.stats[rk].exposed) e++;
    });
  });
  return {total:t,mastered:m,exposed:e,unseen:t-e};
}

function getWeakWords(limit){
  var all = [];
  Object.keys(LV).forEach(function(k){
    var ls = state[k];
    Object.keys(ls.stats||{}).forEach(function(rk){
      var st = ls.stats[rk]||{};
      if(st.skipCount >= 2 && !st.mastered){
        for(var i=0;i<pool.length;i++){
          if(pool[i].freq_rank === parseInt(rk)){
            all.push({rank:rk, word:pool[i].word, skips:st.skipCount, meaning:pool[i].meaning});
            break;
          }
        }
      }
    });
  });
  all.sort(function(a,b){return b.skips - a.skips;});
  return all.slice(0, limit||15);
}

// ---- Dark mode ----
function toggleDark(){
  darkMode = !darkMode;
  if(darkMode){document.body.classList.add('dark');}
  else{document.body.classList.remove('dark');}
  saveLocal();
  render();
}

// ---- Backup / Restore ----
function backup(){
  var out = {_version: STATE_VERSION};
  Object.keys(LV).forEach(function(k){out[k] = state[k];});
  out._todayLog = todayLog; out._darkMode = darkMode;
  var blob = new Blob([JSON.stringify(out, null, 2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cet6_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  note('进度已备份','ok');
}

function restore(){document.getElementById('fin').click();}

function handleFile(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      var ver = d._version || 1;
      if(ver < STATE_VERSION) d = migrateState(d, ver);
      Object.keys(LV).forEach(function(k){
        if(d[k] && d[k].active !== undefined) state[k] = d[k];
      });
      if(d._todayLog) todayLog = d._todayLog;
      if(d._darkMode !== undefined) darkMode = d._darkMode;
      saveLocal();
      if(state[cur].active.length===0) refill(cur);
      note('进度已恢复，共 '+stats().mastered+' 词已掌握','ok');
      render();
    }catch(ex){note('文件格式错误','err');}
  };
  r.readAsText(f); e.target.value = '';
}

function resetAll(){
  if(!confirm('确定要重置所有学习进度吗？\n\n此操作不可撤销，建议先「备份进度」。')) return;
  localStorage.removeItem(LS_KEY);
  initState(); Object.keys(LV).forEach(function(k){refill(k);});
  todayLog = {}; darkMode = false;
  document.body.classList.remove('dark'); saveLocal();
  note('进度已重置','ok'); render();
}

function shuffle(){
  var ls = state[cur], lp = pool.slice(LV[cur].a, LV[cur].b);
  var aset = {}; ls.active.forEach(function(r){aset[r]=true;});
  var keep=[], remove=[];
  ls.active.forEach(function(r){
    var st = ls.stats[r]||{};
    if(st.mastered) remove.push(r);
    else if(st.exposed>2) remove.push(r);
    else keep.push(r);
  });
  if(keep.length<3){while(keep.length<3 && remove.length>0) keep.push(remove.pop());}
  var toRemove = Math.min(7, remove.length);
  var removeSet = {}; remove.slice(0,toRemove).forEach(function(r){removeSet[r]=true;});
  ls.active = ls.active.filter(function(r){return !removeSet[r];});
  refill(cur);
  for(var i=ls.active.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=ls.active[i];ls.active[i]=ls.active[j];ls.active[j]=tmp;
  }
  saveLocal(); note('已刷新 '+toRemove+' 句','ok'); render();
}

function note(t,c){
  var el = document.getElementById('note'); if(!el) return;
  el.textContent = t; el.className = 'note '+(c||'ok');
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){el.textContent='';el.className='note';},3500);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---- Stats Panel ----
function showStatsPanel(){
  var s = stats(), ts = todayStats();
  var weak = getWeakWords(15);
  var pct = s.total>0 ? (100*s.mastered/s.total).toFixed(1) : '0.0';

  var weakHTML = '';
  if(weak.length > 0){
    weakHTML = '<div class="weak-list"><table>';
    weak.forEach(function(w){
      weakHTML += '<tr><td class="wn">跳过'+w.skips+'次</td><td>'+esc(w.word)+'</td><td style="font-size:.75em;color:var(--light)">'+esc((w.meaning||'').slice(0,40))+'</td></tr>';
    });
    weakHTML += '</table></div>';
  } else {
    weakHTML = '<p style="color:var(--light);font-size:.82em">暂无薄弱词汇（跳过≥2次才会出现）</p>';
  }

  var html =
    '<input type="file" id="fin" accept=".json">'+
    '<div class="main"><div class="card" style="border-left-color:#5a8a5a">'+
      '<div style="font-size:.9em;margin-bottom:8px;color:var(--muted)">学习统计</div>'+
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px">'+
        '<span>今日已学 <b>'+ts.total+'</b> 句（掌握 '+ts.know+' | 跳过 '+ts.skip+'）</span>'+
      '</div>'+
      '<div style="font-size:.82em;color:var(--muted);margin-bottom:8px">'+
        '累计掌握 <b>'+s.mastered+'</b> / '+s.total+' ('+pct+'%) | 未见过 '+s.unseen+' 词'+
      '</div>'+
      '<div style="font-size:.85em;color:var(--muted);margin-bottom:4px">薄弱词汇（跳过≥2次）：</div>'+weakHTML+
      '<button class="btn btn-yes" style="margin-top:10px" id="btn-close-stats">返回练习</button>'+
    '</div></div>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-close-stats').onclick = render;
  document.getElementById('fin').onchange = handleFile;
  // fix dark mode
  if(darkMode) document.body.classList.add('dark');
}

// ---- Render ----
function render(){
  var s = stats(), ts = todayStats();
  var pct = s.total>0 ? (100*s.mastered/s.total).toFixed(1) : '0.0';

  document.getElementById('today-info').textContent =
    '今日：已学 '+ts.total+' 句 | 掌握 '+ts.know+' | 跳过 '+ts.skip +
    ' | 累计掌握 '+s.mastered+' 词 ('+pct+'%)';

  if(darkMode) document.body.classList.add('dark');
  else document.body.classList.remove('dark');

  var lvHTML = Object.keys(LV).map(function(k){
    return '<button class="lv'+(cur===k?' on':'')+'" id="lv-'+k+'">'+LV[k].label+'</button>';
  }).join('');

  var ls = state[cur];
  var cards = ls.active.map(function(r){
    for(var i=0;i<pool.length;i++) if(pool[i].freq_rank===r) return pool[i];
    return null;
  }).filter(Boolean);

  var cardsHTML = '';
  if(cards.length===0){
    refill(cur);
    if(state[cur].active.length===0){refill(cur);}
    cardsHTML = '<div class="empty">加载中...</div>';
    setTimeout(render,100); return;
  }
  cardsHTML = cards.map(function(c,i){
    var st = ls.stats[c.freq_rank]||{};
    var skipCount = st.skipCount||0;
    var cntHTML = skipCount > 0 ? '<span class="cnt">上次未掌握'+(skipCount>1?' · 共'+skipCount+'次':'')+'</span>' : '';
    return '<div class="card" id="cd-'+c.freq_rank+'">'+
      '<div class="hdr"><span class="rnk">#'+c.freq_rank+' ['+(i+1)+'/'+cards.length+']</span>'+cntHTML+'</div>'+
      '<div class="en">'+esc(c.sentence_en)+'</div>'+
      '<button class="tgl" id="tgl-'+c.freq_rank+'">查看翻译 / 隐藏</button>'+
      '<div class="zh" id="zh-'+c.freq_rank+'">'+esc(c.sentence_zh)+'</div>'+
      '<div class="sep"></div>'+
      '<div class="acts">'+
        '<button class="btn btn-yes" data-r="'+c.freq_rank+'">认识</button>'+
        '<button class="btn btn-no" data-r="'+c.freq_rank+'">跳过</button>'+
      '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<input type="file" id="fin" accept=".json">'+
    '<div class="tools">'+
      '<button class="tb" id="btn-stats">学习统计</button>'+
      '<button class="tb" id="btn-backup">备份进度</button>'+
      '<button class="tb green" id="btn-restore">恢复进度</button>'+
      '<button class="tb" id="btn-sync" title="即将推出">云同步</button>'+
      '<button class="tb" id="btn-random">随机刷新</button>'+
      '<button class="tb" id="btn-dark">'+(darkMode?'浅色模式':'深色模式')+'</button>'+
      '<button class="tb danger" id="btn-reset">重置进度</button>'+
    '</div>'+
    '<div class="levels">'+lvHTML+'</div>'+
    '<div class="stats-bar">'+
      '<span>今日 '+ts.know+' 掌握 / '+ts.skip+' 跳过</span>'+
      '<span>累计 '+s.mastered+'/'+s.total+' ('+pct+'%)</span>'+
      '<span>未见过 '+s.unseen+' 词</span>'+
    '</div>'+
    '<div class="note" id="note"></div>'+
    '<div class="main">'+cardsHTML+'</div>'+
    '<div class="foot">备份/恢复进度文件实现多设备同步 | K 认识 · S 跳过 · T 翻译 · R 刷新 · D 深色</div>';

  // Bind all events
  document.getElementById('btn-backup').onclick = backup;
  document.getElementById('btn-restore').onclick = restore;
  document.getElementById('btn-sync').onclick = function(){ note('云同步功能即将推出，敬请期待', 'ok'); };
  document.getElementById('btn-random').onclick = shuffle;
  document.getElementById('btn-dark').onclick = toggleDark;
  document.getElementById('btn-reset').onclick = resetAll;
  document.getElementById('btn-stats').onclick = showStatsPanel;
  document.getElementById('fin').onchange = handleFile;

  Object.keys(LV).forEach(function(k){
    document.getElementById('lv-'+k).onclick = function(){cur=k;if(state[cur].active.length===0)refill(cur);render();};
  });

  // Card toggle buttons - bind via JS, not inline
  cards.forEach(function(c){
    var tglBtn = document.getElementById('tgl-'+c.freq_rank);
    var zhDiv = document.getElementById('zh-'+c.freq_rank);
    if(tglBtn && zhDiv){
      tglBtn.onclick = function(){zhDiv.style.display = zhDiv.style.display==='block'?'none':'block';};
    }
  });

  // Know / Skip buttons
  document.querySelectorAll('.btn-yes').forEach(function(b){
    b.onclick = function(){
      var r = parseInt(this.getAttribute('data-r'));
      var cd = document.getElementById('cd-'+r); if(cd) cd.classList.add('done');
      master(r); logToday('know'); saveLocal();
      setTimeout(render,300);
    };
  });
  document.querySelectorAll('.btn-no').forEach(function(b){
    b.onclick = function(){
      var r = parseInt(this.getAttribute('data-r'));
      var cd = document.getElementById('cd-'+r); if(cd) cd.classList.add('skip');
      var ls = state[cur];
      ls.active = ls.active.filter(function(x){return x!==r;});
      ls.active.push(r);
      if(!ls.stats[r]) ls.stats[r]={};
      ls.stats[r].exposed = (ls.stats[r].exposed||0)+1;
      ls.stats[r].skipCount = (ls.stats[r].skipCount||0)+1;
      logToday('skip'); saveLocal();
      setTimeout(render,200);
    };
  });
}

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  switch(e.key.toLowerCase()){
    case 'k': var b=document.querySelector('.btn-yes'); if(b) b.click(); break;
    case 's': var b=document.querySelector('.btn-no'); if(b) b.click(); break;
    case 't': var b=document.querySelector('.tgl'); if(b) b.click(); break;
    case 'r': shuffle(); break;
    case 'd': toggleDark(); break;
    case 'b': backup(); break;
  }
});

// Init
initState();
if(!loadLocal()){
  Object.keys(LV).forEach(function(k){refill(k);});
  saveLocal();
}
if(state[cur].active.length===0) refill(cur);
if(darkMode) document.body.classList.add('dark');
render();
})();
</script>
</body>
</html>
