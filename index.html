<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CET-6 词汇句子练习 v2.4</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CET-6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
--bg:#f5f0eb;--card:#fff;--text:#2c2416;--muted:#8b7355;--light:#b0a090;
--header-bg:#2c2416;--header-text:#e8d5b7;--border:#8b7355;--dash:#e0d5c5;
--know-bg:#8b7355;--know-text:#fff;--skip-bg:transparent;--skip-text:#8b7355;
--danger:#c44;--warn:#c0a060;--stat-bg:#ede6dd
}
body.dark{
--bg:#1a1815;--card:#2a2520;--text:#d8d0c8;--muted:#a09080;--light:#706050;
--header-bg:#0d0b08;--header-text:#c0b090;--border:#5a4a38;--dash:#3a3028;
--know-bg:#8b7355;--know-text:#fff;--skip-bg:transparent;--skip-text:#a09080;
--danger:#e55;--warn:#a08040;--stat-bg:#252018
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Microsoft YaHei',serif;background:var(--bg);color:var(--text);min-height:100vh}
.top{background:var(--header-bg);color:var(--header-text);padding:10px 0;text-align:center}
.top h1{font-size:1.15em;font-weight:normal;letter-spacing:2px}
.top .info{font-size:.7em;opacity:.7;margin-top:2px}
.tools{display:flex;gap:5px;justify-content:center;padding:6px;flex-wrap:wrap}
.tb{padding:4px 12px;border:1px solid var(--border);border-radius:3px;font-size:.74em;
  cursor:pointer;background:transparent;color:var(--muted)}
.tb:hover{background:var(--border);color:#fff}
.tb.green{color:#5a8a5a;border-color:#5a8a5a}.tb.green:hover{background:#5a8a5a;color:#fff}
.tb.danger{color:var(--danger);border-color:var(--danger)}
.tb.danger:hover{background:var(--danger);color:#fff}
.levels{display:flex;gap:6px;justify-content:center;padding:6px}
.lv{padding:8px 18px;border:2px solid var(--border);background:transparent;color:var(--muted);
  font-size:.85em;cursor:pointer;border-radius:4px}
.lv:hover,.lv.on{background:var(--border);color:#fff}
.lv.long{border-color:#c08050;color:#c08050}.lv.long:hover,.lv.long.on{background:#c08050;color:#fff}
.lv.listen{border-color:#7b5ea7;color:#7b5ea7}.lv.listen:hover,.lv.listen.on{background:#7b5ea7;color:#fff}
.en-long{font-size:.92em;line-height:1.55}.zh-long{font-size:.8em;line-height:1.45}
.listen-group{counter-reset:lsn}
.listen-en{font-size:.95em;line-height:1.7;padding:6px 0}
.listen-en::before{counter-increment:lsn;content:counter(lsn)". ";color:var(--light);font-weight:bold}
.listen-zh{font-size:.8em;color:var(--muted);line-height:1.6;padding:2px 0;display:none}
.listen-zh::before{content:"→ ";color:var(--light)}
.listen-divider{border:none;border-top:1px dashed var(--dash);margin:6px 0 8px}
.stats-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:6px 10px;font-size:.76em;color:var(--muted)}
.stats-bar span{background:var(--stat-bg);padding:3px 10px;border-radius:3px;white-space:nowrap}
.note{text-align:center;font-size:.74em;min-height:1.1em;margin:2px 0}
.note.ok{color:#5a8a5a}.note.err{color:var(--danger)}
.main{max-width:700px;margin:0 auto;padding:0 14px 70px}
.card{background:var(--card);border-radius:8px;padding:24px 26px;margin:12px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid var(--border);transition:opacity .3s}
.card.done{opacity:.25}.card.skip{opacity:.5;border-left-color:var(--warn)}
.card .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .rnk{font-size:.68em;color:var(--light)}
.card .cnt{font-size:.65em;color:var(--warn);font-style:italic}
.card .en{font-size:1.02em;line-height:1.6;margin-bottom:8px}
.card .sep{height:20px}
.card .zh{font-size:.85em;color:var(--muted);line-height:1.5;display:none;
  padding-top:8px;border-top:1px dashed var(--dash);margin-bottom:8px}
.card .tgl{font-size:.75em;color:var(--light);cursor:pointer;background:none;
  border:none;text-decoration:underline;padding:0;margin-bottom:10px;display:block}
.card .acts{margin-top:18px;display:flex;gap:14px}
.btn{padding:8px 20px;border:1px solid var(--border);border-radius:4px;font-size:.85em;cursor:pointer}
.btn-yes{background:var(--know-bg);color:var(--know-text)}.btn-yes:hover{opacity:.85}
.btn-no{background:var(--skip-bg);color:var(--skip-text)}.btn-no:hover{background:var(--stat-bg)}
.btn-warn{background:transparent;color:var(--danger);border-color:var(--danger);font-size:.78em;padding:6px 14px}.btn-warn:hover{background:var(--danger);color:#fff}
.empty{text-align:center;padding:80px 0;color:var(--light);font-size:.95em}
.foot{text-align:center;padding:10px;color:var(--light);font-size:.68em;position:fixed;bottom:0;width:100%;background:var(--bg)}
.weak-list{margin:10px 0;font-size:.82em;max-height:200px;overflow-y:auto}
.weak-list table{width:100%;border-collapse:collapse}
.weak-list td{padding:4px 8px;border-bottom:1px solid var(--dash)}
.weak-list .wn{color:var(--warn);font-weight:bold}
</style>
</head>
<body>
<div class="top"><h1>CET-6 词汇句子练习 <span style="font-size:.5em;opacity:.6;vertical-align:middle" id="ver-badge"></span></h1><div class="info" id="today-info"></div></div>
<div id="app"><div style="text-align:center;padding:60px;color:var(--muted)">加载中...</div></div>
<input type="file" id="fin" accept=".json" style="display:none">

<script>
var APP_VERSION = '2.4';
var LOADED = {data: false, index: false};

function loadScript(src, name) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src + '?v=' + encodeURIComponent(APP_VERSION);
    s.onload = function() { LOADED[name] = true; resolve(); };
    s.onerror = function() { reject(); };
    document.head.appendChild(s);
  });
}

function showRetry(msg) {
  document.getElementById('app').innerHTML =
    '<div class="empty"><p>' + msg + '</p>' +
    '<button class="btn btn-yes" style="margin-top:16px" onclick="initApp()">重新加载</button>' +
    '<p style="font-size:.7em;color:var(--light);margin-top:8px">多次失败请检查网络后刷新页面</p></div>';
}

function initApp() {
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">正在加载数据...</div>';
  Promise.all([
    loadScript('data.js', 'data'),
    loadScript('index_data.js', 'index'),
    loadScript('listening_data.js', 'listen')
  ]).then(function() { bootApp(); }).catch(function() {
    showRetry('数据加载失败，请检查网络连接');
  });
}

function bootApp() {
var pool = window.CET6_DATA || [];
var idx = window.CET6_INDEX || {};
if(!pool.length){showRetry('词汇数据为空，请刷新页面');return;}

var T = 10;
var s2w = idx.sentence_to_words || {};
var w2r = {}, rankMap = {};
pool.forEach(function(w){w2r[w.word.toLowerCase()]=w.freq_rank; rankMap[w.freq_rank]=w;});

var n = pool.length;
var LV = {
  L1:{label:'基础级（高频 2000 词）',a:0,b:2000},
  L2:{label:'进阶级（核心 2500 词）',a:2000,b:4500},
  L3:{label:'高级（进阶 3514 词）',a:4500,b:n},
  L4:{label:'长阅读',a:0,b:n,long:true},
  L5:{label:'听力训练',a:0,b:n,listen:true}
};

// Pre-made listening groups (100 groups, 4 sentences each, same theme)
var listeningGroups = window.LISTENING_GROUPS || [];
// Shuffle group order for each user
for(var i = listeningGroups.length - 1; i > 0; i--){
  var j = Math.floor(Math.random() * (i + 1));
  var tmp = listeningGroups[i]; listeningGroups[i] = listeningGroups[j]; listeningGroups[j] = tmp;
}

var state = {}, cur = 'L1', noteTimer = null, darkMode = false;
var todayKey = new Date().toISOString().slice(0,10);
var todayLog = {};

var LS_KEY = 'cet6_progress';
var STATE_VERSION = 3;

function saveLocal(){
  try{
    var cpt = {_version: STATE_VERSION};
    Object.keys(LV).forEach(function(k){
      cpt[k] = {active:state[k].active,stats:state[k].stats,poolSize:state[k].poolSize};
    });
    cpt._todayLog = todayLog; cpt._darkMode = darkMode;
    localStorage.setItem(LS_KEY, JSON.stringify(cpt));
  }catch(e){}
}

function migrateState(cpt, fromVer){
  if(fromVer < 2){
    Object.keys(LV).forEach(function(k){
      if(!cpt[k]) return;
      Object.keys(cpt[k].stats||{}).forEach(function(rk){
        if(cpt[k].stats[rk].skipCount === undefined) cpt[k].stats[rk].skipCount = 0;
      });
    });
    if(!cpt._todayLog) cpt._todayLog = {};
    if(cpt._darkMode === undefined) cpt._darkMode = false;
  }
  if(fromVer < 3){
    // migrated — no longer needed (badTranslation / _badList removed)
  }
  return cpt;
}

function loadLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    var cpt = JSON.parse(raw);
    var ver = cpt._version || 1;
    if(ver < STATE_VERSION) cpt = migrateState(cpt, ver);
    Object.keys(LV).forEach(function(k){
      if(cpt[k] && cpt[k].active !== undefined) state[k] = cpt[k];
      state[k].poolSize = LV[k].listen ? listeningGroups.length : pool.slice(LV[k].a, LV[k].b).filter(function(w){
        return LV[k].long ? w.sentence_long : true;
      }).length;
    });
    if(cpt._todayLog) todayLog = cpt._todayLog;
    if(cpt._darkMode !== undefined) darkMode = cpt._darkMode;
    return true;
  }catch(e){return false;}
}

function todayStats(){
  var log = todayLog[todayKey] || {know:0, skip:0};
  return {know:log.know||0, skip:log.skip||0, total:(log.know||0)+(log.skip||0)};
}
function logToday(action){
  if(!todayLog[todayKey]) todayLog[todayKey] = {know:0, skip:0};
  todayLog[todayKey][action] = (todayLog[todayKey][action]||0) + 1;
}

function initState(){
  Object.keys(LV).forEach(function(k){
    var sz = LV[k].listen ? listeningGroups.length : pool.slice(LV[k].a, LV[k].b).length;
    state[k] = {active:[],stats:{},poolSize:sz};
  });
}

function refill(k){
  var ls = state[k], lp = pool.slice(LV[k].a, LV[k].b);
  if(LV[k].long) lp = lp.filter(function(w){return w.sentence_long;});
  var need = T - ls.active.length;
  if(need <= 0) return;
  var aset = {}; ls.active.forEach(function(r){aset[r]=true;});
  var unseen=[], struggle=[], review=[];
  lp.forEach(function(w){
    if(aset[w.freq_rank]) return;
    var st = ls.stats[w.freq_rank]||{};
    if(!st.exposed) unseen.push(w);
    else if(st.mastered) review.push(w);
    else struggle.push(w);
  });
  struggle.sort(function(a,b){return (ls.stats[b.freq_rank]||{}).skipCount - (ls.stats[a.freq_rank]||{}).skipCount;});
  var picked = [];
  unseen.forEach(function(w){if(picked.length<need)picked.push(w);});
  struggle.forEach(function(w){if(picked.length<need)picked.push(w);});
  if(picked.length<need && review.length) picked.push(review[0]);
  lp.forEach(function(w){
    if(picked.length>=need) return;
    if(!aset[w.freq_rank] && picked.indexOf(w)<0) picked.push(w);
  });
  picked.forEach(function(w){
    ls.active.push(w.freq_rank);
    if(!ls.stats[w.freq_rank]) ls.stats[w.freq_rank]={};
    ls.stats[w.freq_rank].exposed = (ls.stats[w.freq_rank].exposed||0)+1;
  });
}

function master(rank){
  var ls = state[cur];
  if(!ls.stats[rank]) ls.stats[rank]={};
  ls.stats[rank].mastered = true;
  ls.active = ls.active.filter(function(r){return r!==rank;});
  var words = s2w[String(rank)]||[];
  words.forEach(function(wstr){
    var r = w2r[wstr.toLowerCase()];
    if(r && r!==rank){
      if(!ls.stats[r]) ls.stats[r]={};
      if(!ls.stats[r].mastered) ls.stats[r].mastered=true;
    }
  });
  refill(cur);
}

function stats(){
  var t=0,m=0,e=0;
  Object.keys(LV).forEach(function(k){
    var ls=state[k];
    if(!LV[k].long && !LV[k].listen) t+=ls.poolSize||0;
    else if(LV[k].long) t=Math.max(t, ls.poolSize||0);
    Object.keys(ls.stats||{}).forEach(function(rk){
      if(ls.stats[rk].mastered) m++;
      if(ls.stats[rk].exposed) e++;
    });
  });
  return {total:t,mastered:m,exposed:e,unseen:t-e};
}

function getWeakWords(limit){
  var all = [];
  Object.keys(LV).forEach(function(k){
    var ls = state[k];
    Object.keys(ls.stats||{}).forEach(function(rk){
      var st = ls.stats[rk]||{};
      if(st.skipCount >= 2 && !st.mastered){
        var w = rankMap[parseInt(rk)];
        if(w) all.push({rank:rk, word:w.word, skips:st.skipCount, meaning:w.meaning});
      }
    });
  });
  all.sort(function(a,b){return b.skips - a.skips;});
  return all.slice(0, limit||15);
}

function toggleDark(){
  darkMode = !darkMode;
  if(darkMode){document.body.classList.add('dark');}
  else{document.body.classList.remove('dark');}
  saveLocal();
  render();
}

function refreshCache(){
  if('caches' in window){
    caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }).finally(function(){ location.reload(); });
  } else {
    location.reload();
  }
}

function backup(){
  var out = {_version: STATE_VERSION};
  Object.keys(LV).forEach(function(k){out[k] = state[k];});
  out._todayLog = todayLog; out._darkMode = darkMode;
  var blob = new Blob([JSON.stringify(out, null, 2)],{type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cet6_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  note('进度已备份','ok');
}

function restore(){document.getElementById('fin').click();}

function handleFile(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      var ver = d._version || 1;
      if(ver < STATE_VERSION) d = migrateState(d, ver);
      Object.keys(LV).forEach(function(k){
        if(d[k] && d[k].active !== undefined) state[k] = d[k];
      });
      if(d._todayLog) todayLog = d._todayLog;
      if(d._darkMode !== undefined) darkMode = d._darkMode;
      saveLocal();
      if(state[cur].active.length===0) refill(cur);
      var restored = stats().mastered;
      render();
      note('进度已恢复，共 '+restored+' 词已掌握','ok');
    }catch(ex){note('文件格式错误','err');}
  };
  r.onloadend = function(){ e.target.value = ''; };
  r.readAsText(f);
}

function resetAll(){
  if(!confirm('确定要重置所有学习进度吗？\n\n此操作不可撤销，建议先「备份进度」。')) return;
  localStorage.removeItem(LS_KEY);
  initState(); Object.keys(LV).forEach(function(k){refill(k);});
  todayLog = {}; darkMode = false;
  document.body.classList.remove('dark'); saveLocal();
  note('进度已重置','ok'); render();
}

function shuffle(){
  var ls = state[cur], lp = pool.slice(LV[cur].a, LV[cur].b);
  var aset = {}; ls.active.forEach(function(r){aset[r]=true;});
  var keep=[], remove=[];
  ls.active.forEach(function(r){
    var st = ls.stats[r]||{};
    if(st.mastered) remove.push(r);
    else if(st.exposed>2) remove.push(r);
    else keep.push(r);
  });
  if(keep.length<3){while(keep.length<3 && remove.length>0) keep.push(remove.pop());}
  var toRemove = Math.min(7, remove.length);
  var removeSet = {}; remove.slice(0,toRemove).forEach(function(r){removeSet[r]=true;});
  ls.active = ls.active.filter(function(r){return !removeSet[r];});
  refill(cur);
  for(var i=ls.active.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=ls.active[i];ls.active[i]=ls.active[j];ls.active[j]=tmp;
  }
  saveLocal(); note('已刷新 '+toRemove+' 句','ok'); render();
}

function note(t,c){
  var el = document.getElementById('note'); if(!el) return;
  el.textContent = t; el.className = 'note '+(c||'ok');
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){el.textContent='';el.className='note';},3500);
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showStatsPanel(){
  var s = stats(), ts = todayStats();
  var weak = getWeakWords(15);
  var pct = s.total>0 ? (100*s.mastered/s.total).toFixed(1) : '0.0';

  var weakHTML = '';
  if(weak.length > 0){
    weakHTML = '<div class="weak-list"><table>';
    weak.forEach(function(w){
      weakHTML += '<tr><td class="wn">跳过'+w.skips+'次</td><td>'+esc(w.word)+'</td><td style="font-size:.75em;color:var(--light)">'+esc((w.meaning||'').slice(0,40))+'</td></tr>';
    });
    weakHTML += '</table></div>';
  } else {
    weakHTML = '<p style="color:var(--light);font-size:.82em">暂无薄弱词汇（跳过≥2次才会出现）</p>';
  }

  var html =
    '<div class="main"><div class="card" style="border-left-color:#5a8a5a">'+
      '<div style="font-size:.9em;margin-bottom:8px;color:var(--muted)">学习统计</div>'+
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px">'+
        '<span>今日已学 <b>'+ts.total+'</b> 句（掌握 '+ts.know+' | 跳过 '+ts.skip+'）</span>'+
      '</div>'+
      '<div style="font-size:.82em;color:var(--muted);margin-bottom:8px">'+
        '累计掌握 <b>'+s.mastered+'</b> / '+s.total+' ('+pct+'%) | 未见过 '+s.unseen+' 词'+
      '</div>'+
      '<div style="font-size:.85em;color:var(--muted);margin-bottom:4px">薄弱词汇（跳过≥2次）：</div>'+weakHTML+
      '<button class="btn btn-yes" style="margin-top:10px" id="btn-close-stats">返回练习</button>'+
    '</div></div>';
  document.getElementById('app').innerHTML = html;
  document.getElementById('btn-close-stats').onclick = render;
  if(darkMode) document.body.classList.add('dark');
}

// ---- Listening Training ----
function getSeenGroups(){
  try{ return JSON.parse(localStorage.getItem('cet6_seen_groups') || '[]'); }catch(e){ return []; }
}
function saveSeenGroups(arr){ localStorage.setItem('cet6_seen_groups', JSON.stringify(arr)); }

function renderListening(){
  var s = stats(), ts = todayStats();
  var pct = s.total>0 ? (100*s.mastered/s.total).toFixed(1) : '0.0';

  document.getElementById('today-info').textContent =
    '今日：已学 '+ts.total+' 句 | 掌握 '+ts.know+' | 跳过 '+ts.skip +
    ' | 累计掌握 '+s.mastered+' 词 ('+pct+'%)';

  if(darkMode) document.body.classList.add('dark');
  else document.body.classList.remove('dark');

  var seen = getSeenGroups();

  // Pick an unseen group; if all seen, reset
  var available = [];
  for(var i = 0; i < listeningGroups.length; i++){
    if(seen.indexOf(i) < 0) available.push(i);
  }
  if(available.length === 0){ seen = []; saveSeenGroups(seen); available = listeningGroups.map(function(_,i){return i;}); }
  var gi = available[Math.floor(Math.random() * available.length)];
  var group = listeningGroups[gi];
  seen.push(gi); saveSeenGroups(seen);

  var enHTML = group.sentences.map(function(s){
    return '<div class="listen-en">' + esc(s.en) + '</div>';
  }).join('');
  var zhHTML = group.sentences.map(function(s){
    return '<div class="listen-zh">' + esc(s.zh) + '</div>';
  }).join('');

  var remaining = listeningGroups.length - seen.length;

  var lvHTML = Object.keys(LV).map(function(k){
    return '<button class="lv'+(cur===k?' on':'')+(LV[k].long?' long':'')+(LV[k].listen?' listen':'')+'" id="lv-'+k+'">'+LV[k].label+'</button>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="tools">'+
      '<button class="tb" id="btn-stats">学习统计</button>'+
      '<button class="tb" id="btn-backup">备份进度</button>'+
      '<button class="tb green" id="btn-restore">恢复进度</button>'+
      '<button class="tb" id="btn-dark">'+(darkMode?'浅色模式':'深色模式')+'</button>'+
      '<button class="tb" id="btn-refresh-cache" style="color:#c08050;border-color:#c08050;font-size:.7em" title="清除缓存重新加载最新版本">刷新缓存</button>'+
    '</div>'+
    '<div class="levels">'+lvHTML+'</div>'+
    '<div class="stats-bar">'+
      '<span>今日 '+ts.know+' 掌握 / '+ts.skip+' 跳过</span>'+
      '<span>累计 '+s.mastered+'/'+s.total+' ('+pct+'%)</span>'+
      '<span>剩余 '+remaining+' 组</span>'+
    '</div>'+
    '<div class="note" id="note"></div>'+
    '<div class="main">'+
      '<div class="card" style="border-left-color:#7b5ea7">'+
        '<div class="hdr"><span class="rnk">听力训练 · ' + esc(group.topic) + '</span><span class="cnt">' + remaining + ' 组未练</span></div>'+
        '<div class="listen-group">' + enHTML + '</div>'+
        '<hr class="listen-divider">'+
        '<button class="tgl" id="tgl-listen" style="margin-bottom:6px">查看翻译 / 隐藏</button>'+
        '<div id="zh-group">' + zhHTML + '</div>'+
        '<div class="acts">'+
          '<button class="btn btn-yes" id="btn-listen-next">下一组</button>'+
          '<button class="btn btn-no" id="btn-listen-skip">跳过</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="foot">'+
      '<a href="#" id="btn-help" style="color:var(--light);margin-right:12px">使用说明</a>'+
      '<a href="https://github.com/wangshiyuan-nku/cet6-practice" target="_blank" style="color:var(--light)">GitHub 仓库</a>'+
      ' &nbsp;|&nbsp; T 翻译 · N 下一组'+
    '</div>';

  document.getElementById('btn-stats').onclick = showStatsPanel;
  document.getElementById('btn-backup').onclick = backup;
  document.getElementById('btn-restore').onclick = restore;
  document.getElementById('btn-dark').onclick = toggleDark;
  document.getElementById('btn-refresh-cache').onclick = refreshCache;
  var helpBtn = document.getElementById('btn-help');
  if(helpBtn) helpBtn.onclick = function(e){ e.preventDefault(); showHelp(); };

  Object.keys(LV).forEach(function(k){
    var el = document.getElementById('lv-'+k);
    if(el) el.onclick = function(){
      cur = k;
      if(LV[k].listen) renderListening();
      else { if(state[cur].active.length===0) refill(cur); render(); }
    };
  });

  var tglBtn = document.getElementById('tgl-listen');
  var zhGroup = document.getElementById('zh-group');
  if(tglBtn && zhGroup){
    tglBtn.onclick = function(){
      var divs = zhGroup.querySelectorAll('.listen-zh');
      var showing = divs.length > 0 && divs[0].style.display === 'block';
      divs.forEach(function(d){ d.style.display = showing ? 'none' : 'block'; });
    };
  }

  document.getElementById('btn-listen-next').onclick = function(){
    // Mark all 4 sentences as mastered
    group.sentences.forEach(function(s){
      var ls = state['L5'];
      if(!ls.stats[s.rank]) ls.stats[s.rank] = {};
      ls.stats[s.rank].exposed = (ls.stats[s.rank].exposed||0) + 1;
    });
    logToday('know'); saveLocal();
    renderListening();
  };

  document.getElementById('btn-listen-skip').onclick = function(){
    group.sentences.forEach(function(s){
      var ls = state['L5'];
      if(!ls.stats[s.rank]) ls.stats[s.rank] = {};
      ls.stats[s.rank].skipCount = (ls.stats[s.rank].skipCount||0) + 1;
      ls.stats[s.rank].exposed = (ls.stats[s.rank].exposed||0) + 1;
    });
    logToday('skip'); saveLocal();
    renderListening();
  };
}

function render(){
  if(LV[cur] && LV[cur].listen){ renderListening(); return; }
  var s = stats(), ts = todayStats();
  var pct = s.total>0 ? (100*s.mastered/s.total).toFixed(1) : '0.0';

  document.getElementById('today-info').textContent =
    '今日：已学 '+ts.total+' 句 | 掌握 '+ts.know+' | 跳过 '+ts.skip +
    ' | 累计掌握 '+s.mastered+' 词 ('+pct+'%)';

  if(darkMode) document.body.classList.add('dark');
  else document.body.classList.remove('dark');

  var lvHTML = Object.keys(LV).map(function(k){
    return '<button class="lv'+(cur===k?' on':'')+(LV[k].long?' long':'')+(LV[k].listen?' listen':'')+'" id="lv-'+k+'">'+LV[k].label+'</button>';
  }).join('');

  var ls = state[cur];
  var cards = ls.active.map(function(r){
    return rankMap[r] || null;
  }).filter(Boolean);

  var cardsHTML = '';
  if(cards.length===0){
    refill(cur);
    if(state[cur].active.length===0){
      cardsHTML = '<div class="empty">当前级别已无更多句子可学，切换到其他级别或刷新试试</div>';
    } else {
      cardsHTML = '<div class="empty">加载中...</div>';
      setTimeout(render,100); return;
    }
  }
  cardsHTML = cards.map(function(c,i){
    var st = ls.stats[c.freq_rank]||{};
    var skipCount = st.skipCount||0;
    var cntHTML = skipCount > 0 ? '<span class="cnt">上次未掌握'+(skipCount>1?' · 共'+skipCount+'次':'')+'</span>' : '';
    var en = (LV[cur].long && c.sentence_long) ? c.sentence_long : c.sentence_en;
    var zh = (LV[cur].long && c.sentence_long) ? (c.zh_long || c.sentence_zh) : c.sentence_zh;
    var longClass = (LV[cur].long && c.sentence_long) ? ' en-long' : '';
    return '<div class="card" id="cd-'+c.freq_rank+'">'+
      '<div class="hdr"><span class="rnk">#'+c.freq_rank+' ['+(i+1)+'/'+cards.length+']</span>'+cntHTML+'</div>'+
      '<div class="en'+longClass+'">'+esc(en)+'</div>'+
      '<button class="tgl" id="tgl-'+c.freq_rank+'">查看翻译 / 隐藏</button>'+
      '<div class="zh'+longClass+'" id="zh-'+c.freq_rank+'">'+esc(zh)+'</div>'+
      '<div class="sep"></div>'+
      '<div class="acts">'+
        '<button class="btn btn-yes" data-r="'+c.freq_rank+'">认识</button>'+
        '<button class="btn btn-no" data-r="'+c.freq_rank+'">跳过</button>'+
      '</div></div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="tools">'+
      '<button class="tb" id="btn-stats">学习统计</button>'+
      '<button class="tb" id="btn-backup">备份进度</button>'+
      '<button class="tb green" id="btn-restore">恢复进度</button>'+
      '<button class="tb" id="btn-sync" title="即将推出">云同步</button>'+
      '<button class="tb" id="btn-random">随机刷新</button>'+
      '<button class="tb" id="btn-dark">'+(darkMode?'浅色模式':'深色模式')+'</button>'+
      '<button class="tb danger" id="btn-reset">重置进度</button>'+
      '<button class="tb" id="btn-guide" style="color:#4a90c4;border-color:#4a90c4">新手指导</button>'+
      '<button class="tb" id="btn-refresh-cache" style="color:#c08050;border-color:#c08050;font-size:.7em" title="清除缓存并重新加载最新版本">刷新缓存</button>'+
    '</div>'+
    '<div class="levels">'+lvHTML+'</div>'+
    '<div class="stats-bar">'+
      '<span>今日 '+ts.know+' 掌握 / '+ts.skip+' 跳过</span>'+
      '<span>累计 '+s.mastered+'/'+s.total+' ('+pct+'%)</span>'+
      '<span>未见过 '+s.unseen+' 词</span>'+
    '</div>'+
    '<div class="note" id="note"></div>'+
    '<div class="main">'+cardsHTML+'</div>'+
    '<div class="foot">'+
      '<a href="#" id="btn-help" style="color:var(--light);margin-right:12px">使用说明</a>'+
      '<a href="https://github.com/wangshiyuan-nku/cet6-practice" target="_blank" style="color:var(--light)">GitHub 仓库</a>'+
      ' &nbsp;|&nbsp; K 认识 · S 跳过 · T 翻译 · R 刷新 · D 深色'+
    '</div>';

  document.getElementById('btn-backup').onclick = backup;
  document.getElementById('btn-restore').onclick = restore;
  document.getElementById('btn-sync').onclick = function(){ note('云同步功能即将推出，敬请期待', 'ok'); };
  document.getElementById('btn-random').onclick = shuffle;
  document.getElementById('btn-dark').onclick = toggleDark;
  document.getElementById('btn-reset').onclick = resetAll;
  document.getElementById('btn-stats').onclick = showStatsPanel;
  document.getElementById('btn-guide').onclick = showGuide;
  document.getElementById('btn-refresh-cache').onclick = refreshCache;
  var helpBtn = document.getElementById('btn-help');
  if(helpBtn) helpBtn.onclick = function(e){ e.preventDefault(); showHelp(); };

  Object.keys(LV).forEach(function(k){
    document.getElementById('lv-'+k).onclick = function(){cur=k;if(state[cur].active.length===0)refill(cur);render();};
  });

  cards.forEach(function(c){
    var tglBtn = document.getElementById('tgl-'+c.freq_rank);
    var zhDiv = document.getElementById('zh-'+c.freq_rank);
    if(tglBtn && zhDiv){
      tglBtn.onclick = function(){zhDiv.style.display = zhDiv.style.display==='block'?'none':'block';};
    }
  });

  document.querySelectorAll('.btn-yes').forEach(function(b){
    b.onclick = function(){
      var r = parseInt(this.getAttribute('data-r'));
      var cd = document.getElementById('cd-'+r); if(cd) cd.classList.add('done');
      master(r); logToday('know'); saveLocal();
      setTimeout(render,300);
    };
  });
  document.querySelectorAll('.btn-no').forEach(function(b){
    b.onclick = function(){
      var r = parseInt(this.getAttribute('data-r'));
      var cd = document.getElementById('cd-'+r); if(cd) cd.classList.add('skip');
      var ls = state[cur];
      ls.active = ls.active.filter(function(x){return x!==r;});
      ls.active.push(r);
      if(!ls.stats[r]) ls.stats[r]={};
      ls.stats[r].exposed = (ls.stats[r].exposed||0)+1;
      ls.stats[r].skipCount = (ls.stats[r].skipCount||0)+1;
      logToday('skip'); saveLocal();
      setTimeout(render,200);
    };
  });
}

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  switch(e.key.toLowerCase()){
    case 'k': var b=document.querySelector('.btn-yes'); if(b) b.click(); break;
    case 's': var b=document.querySelector('.btn-no'); if(b) b.click(); break;
    case 't': var b=document.querySelector('.tgl'); if(b) b.click(); break;
    case 'n': var nb=document.getElementById('btn-listen-next'); if(nb) nb.click(); break;
    case 'r': shuffle(); break;
    case 'd': toggleDark(); break;
    case 'b': backup(); break;
  }
});

// ---- 新手指导 ----
var GUIDE_PAGES = [
  '<div style="text-align:center">'+
    '<div style="font-size:3em;margin:20px 0">&#x1F4DA;</div>'+

    '<p style="color:var(--muted);font-size:.85em;line-height:1.7">本工具帮你通过<b>阅读句子</b>来自测六级词汇量。<br>不用背单词书，读句子就能判断是否掌握。</p>'+
    '<p style="font-size:.82em;color:var(--light);margin-top:10px">约 8,000 个六级词汇 · 4 个难度等级 · 手机电脑都能用</p>'+
  '</div>',

    '<p><b>5.</b> 掌握后自动消失，新句子不断补充</p>'+
  '</div>'+
  '<p style="font-size:.76em;color:var(--muted);margin-top:8px">快捷键：<b>K</b> 认识 · <b>S</b> 跳过 · <b>T</b> 翻译 · <b>R</b> 刷新 · <b>D</b> 深色</p>',

  '<h4 style="margin-bottom:10px">&#x1F3AF; 四个等级</h4>'+
    '<div style="font-size:.84em;line-height:1.9">'+

  '<h4 style="margin-bottom:10px">&#x26A1; 高效学习特性</h4>'+
    '<div style="font-size:.84em;line-height:1.9">'+
    '<p><b>交叉掌握：</b>一个句子含多个六级词，认识一句全部标记掌握</p>'+
    '<p><b>跳过追踪：</b>跳过的词再次出现标注「上次未掌握」和累计次数</p>'+
    '<p><b>薄弱排行：</b>学习统计中按跳过次数排行，发现真正难点</p>'+
    '<p><b>自适应：</b>越不熟的词越优先出现，已掌握的极少打扰</p>'+
  '</div>',

  '<h4 style="margin-bottom:10px">&#x1F504; 进度同步</h4>'+
    '<div style="font-size:.84em;line-height:1.9">'+
    '<p><b>备份：</b>点击「备份进度」下载 .json 文件</p>'+
    '<p><b>保存：</b>放到 iCloud/OneDrive/Dropbox 云盘文件夹</p>'+

  '</div>',

  '<h4 style="margin-bottom:10px">&#x1F4F1; 安装为 App</h4>'+
    '<div style="font-size:.84em;line-height:1.9">'+

    '<p><b>Android：</b>Chrome 打开 → 菜单 → 添加到主屏幕</p>'+
    '<p><b>电脑：</b>Chrome/Edge 地址栏安装图标 → 安装</p>'+
  '</div>'+
  '<p style="font-size:.76em;color:var(--muted);margin-top:8px">安装后像普通 App，独立图标，离线可用。另可下载桌面版 .exe。</p>',

  '<div style="text-align:center">'+
    '<div style="font-size:3em;margin:20px 0">&#x1F389;</div>'+
    '<h4 style="margin-bottom:8px">准备就绪！</h4>'+

    '<p style="font-size:.8em;margin-top:10px"><a href="https://github.com/wangshiyuan-nku/cet6-practice" target="_blank" style="color:var(--light)">GitHub 仓库</a> · 页面底部可随时查看</p>'+
  '</div>'
];

var G_STEP = 0;

function renderGuide(){
  var isLast = G_STEP >= GUIDE_PAGES.length - 1;
  var dotHTML = GUIDE_PAGES.map(function(_,i){
    return '<div style="width:'+(i===G_STEP?18:7)+'px;height:7px;border-radius:4px;background:'+(i===G_STEP?'var(--border)':'var(--dash)')+'"></div>';
  }).join('');

  var g = '<div class="card" style="max-width:600px;margin:20px auto;text-align:left">'+
    '<div style="display:flex;gap:4px;justify-content:center;margin-bottom:16px">'+dotHTML+'</div>'+
    GUIDE_PAGES[G_STEP]+
    '<div style="display:flex;justify-content:space-between;margin-top:18px">'+
      (G_STEP>0 ? '<button class="btn btn-no" id="guide-prev">上一步</button>' : '<span></span>')+
      (isLast ? '<button class="btn btn-yes" id="guide-start">开始练习</button>' : '<button class="btn btn-yes" id="guide-next">下一步</button>')+
    '</div>'+
    (isLast ? '' : '<p style="text-align:center;font-size:.7em;color:var(--light);margin-top:8px">'+(G_STEP+1)+' / '+GUIDE_PAGES.length+'</p>')+
  '</div>';

  document.getElementById('app').innerHTML = '<div class="main">'+g+'</div>';
  if(darkMode) document.body.classList.add('dark');

  var pb = document.getElementById('guide-prev');
  var nb = document.getElementById('guide-next');
  var sb = document.getElementById('guide-start');
  if(pb) pb.onclick = function(){ G_STEP--; renderGuide(); };
  if(nb) nb.onclick = function(){ G_STEP++; renderGuide(); };
  if(sb) sb.onclick = render;
}

function showGuide(){
  G_STEP = 0;
  renderGuide();
}

function showHelp(){
  var h='<div class="card" style="max-width:600px;margin:20px auto;text-align:left;font-size:.85em;line-height:1.7">'+
    '<h3 style="margin-bottom:10px">CET-6 词汇句子练习 v' + APP_VERSION + ' — 使用说明</h3>'+
    '<p><b>目标：</b>通过阅读英语句子自测六级词汇，掌握约 8,000 个词。</p>'+
    '<p><b>等级切换：</b>顶部 4 个标签可切换不同难度。基础级（高频 2,000 词）、进阶级（核心 2,500 词）、高级（进阶 3,514 词）、<span style="color:#c08050">长阅读</span>（原版长句完整版）。</p>'+
    '<p><b>操作：</b>读句子 → 点「查看翻译」对照理解 → 看懂了点认识」标记掌握，不确定点「跳过」稍后再出现。</p>'+
    '<p><b>交叉掌握：</b>「认识」一个句子后，句中所有六级词汇都会标记为已掌握，最大化学习效率。</p>'+
    '<p><b>跳过追踪：</b>每跳过一次会累计，反馈为「上次未掌握」标记和薄弱词汇排行。</p>'+
    '<p><b>键盘快捷键：</b>K 认识 | S 跳过 | T 翻译 | R 刷新 | D 深色模式</p>'+
    '<p><b>进度同步：</b>顶部「备份进度」下载 .json 文件 → 保存到 iCloud/OneDrive → 新设备「恢复进度」导入。</p>'+
    '<p><b>安装 App：</b>手机浏览器打开 → 添加到主屏幕，即可像 App 一样使用。</p>'+
    '<p style="margin-top:12px;font-size:.8em;color:var(--muted)">GitHub: <a href=\"https://github.com/wangshiyuan-nku/cet6-practice\" target=\"_blank\" style=\"color:var(--muted)\">wangshiyuan-nku/cet6-practice</a></p>'+
    '<button class="btn btn-yes" style="margin-top:12px" id="btn-help-close">返回练习</button>'+
    '</div>';
  document.getElementById('app').innerHTML='<div class="main">'+h+'</div>';
  document.getElementById('btn-help-close').onclick = render;
  if(darkMode) document.body.classList.add('dark');
}

// Init
initState();
if(!loadLocal()){
  Object.keys(LV).forEach(function(k){refill(k);});
  saveLocal();
}
document.getElementById('ver-badge').textContent = 'v' + APP_VERSION;
document.getElementById('fin').onchange = handleFile;
if(state[cur].active.length===0) refill(cur);
if(darkMode) document.body.classList.add('dark');
render();
} // end bootApp

initApp();
</script>
